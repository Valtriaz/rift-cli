[package]
name = "rift-cli"
version = "0.1.0"
edition = "2024"
authors = ["Valtriaz"]
license = "MIT"
description = "A terminal-native web browser"
readme = "README.md"
repository = "https://github.com/Valtriaz/rift-cli"
keywords = ["browser", "cli", "terminal", "web", "tui"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
crossterm = "0.29"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "cookies"
] }
scraper = "0.22"
url = "2.5"
unicode-width = "0.2"
